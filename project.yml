name: MilePace
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    BUNDLE_ID: com.example.milepace
    TEAM_ID: ""
targets:
  MilePace:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MilePace
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        INFOPLIST_FILE: MilePace/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(TEAM_ID)
        MARKETING_VERSION: "1.15"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MilePaceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MilePaceTests
    dependencies:
      - target: MilePace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(TEAM_ID)
schemes:
  MilePace:
    build:
      targets:
        MilePace: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MilePaceTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
