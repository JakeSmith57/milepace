name: TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project MilePace.xcodeproj \
            -scheme MilePace \
            -destination "generic/platform=iOS" \
            -archivePath build/MilePace.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            BUNDLE_ID="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Report archive errors as annotations
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/archive.log" ] || exit 0
          grep -E "error:|: error|\*\* ARCHIVE FAILED" "$RUNNER_TEMP/archive.log" | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line:0:600}"
          done

      - name: Prepare export options
        run: |
          python3 - <<'PY'
          import os
          import plistlib

          with open("scripts/ExportOptions.plist", "rb") as handle:
              options = plistlib.load(handle)
          options["teamID"] = os.environ["TEAM_ID"]
          out_path = os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist")
          with open(out_path, "wb") as handle:
              plistlib.dump(options, handle)
          PY

      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/MilePace.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"

      - name: Report export errors as annotations
        if: failure()
        run: |
          grep -iE "error|fail|denied|not found|permission|certificate|profile|invalid" "$RUNNER_TEMP/export.log" | tail -25 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done
          LOGDIR=$(grep -oE "/[^ ]+\.xcdistributionlogs" "$RUNNER_TEMP/export.log" | head -1)
          if [ -n "$LOGDIR" ] && [ -d "$LOGDIR" ]; then
            grep -rhiE "error|fail|denied" "$LOGDIR" | tail -15 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
          fi

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
